[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-book-cover-generator"
version = "0.6.3"
description = "Desktop AI book cover generator — prompt, layout, and render covers locally or via remote backends."
readme = "CONTRIBUTING.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "covergen contributors" }]
keywords = ["ai", "book-cover", "stable-diffusion", "sdxl", "desktop", "tkinter"]

dependencies = [
    "Pillow>=10.2",
    "PyYAML>=6.0",
    "pydantic>=2.7",
    "rich>=13.7",
    "httpx>=0.27",
    "numpy>=1.26",
]

[project.optional-dependencies]
sd = ["diffusers>=0.27", "torch>=2.2", "transformers>=4.40", "accelerate>=0.29"]
onnx = ["onnxruntime>=1.17"]
remote = ["httpx>=0.27"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "black>=24.4",
    "mypy>=1.10",
]

[project.scripts]
covergen = "covergen.__main__:main"

[tool.setuptools.packages.find]
include = ["covergen*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"